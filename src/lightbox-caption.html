<!DOCTYPE html>

        <div class="galeria-item">

        /></a>
        </div>

        <div class="galeria-item">
        <a href="images/Cachorro.jpg" class="glightbox" data-glightbox="title: Bulldog; description: Meu cachorro é a melhor companhia que eu poderia querer! Mesmo sem falar, ele me entende melhor que qualquer pessoa."

        /></a>

        <div class="galeria-item">

        É preciso atenção para enxergar as preciosidades da vida."

        /></a>
